databaseChangeLog:
  - changeSet:
      id: 12-quote-seed-removal
      author: kamil
      comment: Remove seeded quotes; the user keeps only their own.
      changes:
        - delete:
            tableName: quote
            where: "text = 'Since it is possible that you may depart from life this very moment, regulate every act and thought accordingly.'"
        - delete:
            tableName: quote
            where: "text = 'You have power over your mind - not outside events. Realize this, and you will find strength.'"
        - delete:
            tableName: quote
            where: "text = 'The happiness of your life depends upon the quality of your thoughts.'"
        - delete:
            tableName: quote
            where: "text = 'If it is not right, do not do it; if it is not true, do not say it.'"
        - delete:
            tableName: quote
            where: "text = 'The impediment to action advances action. What stands in the way becomes the way.'"
        - delete:
            tableName: quote
            where: "text = 'Waste no more time arguing about what a good man should be. Be one.'"
        - delete:
            tableName: quote
            where: "text = 'We suffer more often in imagination than in reality.'"
        - delete:
            tableName: quote
            where: "text = 'It is not that we have a short time to live, but that we waste a lot of it.'"
        - delete:
            tableName: quote
            where: "text = 'Luck is what happens when preparation meets opportunity.'"
        - delete:
            tableName: quote
            where: "text = 'Difficulties strengthen the mind, as labor does the body.'"
        - delete:
            tableName: quote
            where: "text = 'While we are postponing, life speeds by.'"
        - delete:
            tableName: quote
            where: "text = 'He who is brave is free.'"
        - delete:
            tableName: quote
            where: "text = 'It''s not what happens to you, but how you react to it that matters.'"
        - delete:
            tableName: quote
            where: "text = 'No man is free who is not master of himself.'"
        - delete:
            tableName: quote
            where: "text = 'First say to yourself what you would be; and then do what you have to do.'"
        - delete:
            tableName: quote
            where: "text = 'Wealth consists not in having great possessions, but in having few wants.'"
        - delete:
            tableName: quote
            where: "text = 'Make the best use of what is in your power, and take the rest as it happens.'"
        - delete:
            tableName: quote
            where: "text = 'The journey of a thousand miles begins with a single step.'"
        - delete:
            tableName: quote
            where: "text = 'We are what we repeatedly do. Excellence, then, is not an act, but a habit.'"
        - delete:
            tableName: quote
            where: "text = 'He who has a why to live can bear almost any how.'"
        - delete:
            tableName: quote
            where: "text = 'Well begun is half done.'"
        - delete:
            tableName: quote
            where: "text = 'Very little is needed to make a happy life; it is all within yourself, in your way of thinking.'"
        - delete:
            tableName: quote
            where: "text = 'Begin at once to live, and count each separate day as a separate life.'"
        - delete:
            tableName: quote
            where: "text = 'Men are disturbed not by things, but by the views which they take of them.'"
