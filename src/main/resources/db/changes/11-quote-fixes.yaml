databaseChangeLog:
  - changeSet:
      id: 11-quote-fixes
      author: kamil
      comment: Replace three seeded quotes that were misattributed or invented.
      changes:
        - update:
            tableName: quote
            columns:
              - column:
                  name: text
                  value: "Very little is needed to make a happy life; it is all within yourself, in your way of thinking."
            where: "text = 'You have power over your mind - not outside events. Realize this, and you will find strength.'"
        - update:
            tableName: quote
            columns:
              - column:
                  name: text
                  value: "Begin at once to live, and count each separate day as a separate life."
            where: "text = 'Luck is what happens when preparation meets opportunity.'"
        - update:
            tableName: quote
            columns:
              - column:
                  name: text
                  value: "Men are disturbed not by things, but by the views which they take of them."
            where: "text = 'It''s not what happens to you, but how you react to it that matters.'"
